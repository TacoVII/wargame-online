<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- 厚木塊右側與底側立體厚度 -->
  <polygon points="65,3 70,8 70,70 8,70 3,65" fill="#6e5a3e" stroke="#1c1814" stroke-width="1.5" stroke-linejoin="round" />
  <!-- 正面中性石板灰底板 (未來擴充他國勢力可直接改此色碼) -->
  <rect x="3" y="3" width="62" height="62" fill="#57534e" stroke="#1c1814" stroke-width="2" />
  <rect x="5.5" y="5.5" width="57" height="57" fill="none" stroke="#e5e7eb" stroke-opacity="0.25" stroke-width="1" />
  <!-- 中央北約軍標框 (1.5:1 標準比例) -->
  <rect x="13" y="17" width="42" height="27" fill="#f7efe0" stroke="#1c1814" stroke-width="1.8" />
  <!-- 底部攻-防-移數值區 -->
  <rect x="4.5" y="47" width="59" height="16.5" fill="#120e0a" fill-opacity="0.46" />
</svg>